<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KJ's Games Scorecard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <style>
    :root {
      --bg: #0a0a14;
      --bg2: #12121f;
      --bg3: #1a1a2e;
      --gold: #FFD700;
      --gold-dim: rgba(255, 215, 0, 0.15);
      --gold-glow: rgba(255, 215, 0, 0.35);
      --text: #e8e8f0;
      --text2: #7878a0;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--bg3);
      border-bottom: 2px solid var(--gold);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 20px rgba(255, 215, 0, 0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-left h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .header-icon { font-size: 1.5rem; }

    #newSessionBtn {
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    #newSessionBtn:hover {
      background: var(--gold);
      color: var(--bg);
    }

    /* ── Welcome Screen ── */
    #welcomeScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 24px;
      text-align: center;
    }

    .welcome-trophy {
      font-size: 5rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    #welcomeScreen h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #welcomeScreen p {
      color: var(--text2);
      max-width: 420px;
      line-height: 1.7;
      font-size: 0.95rem;
    }

    #startBtn {
      background: var(--gold);
      color: var(--bg);
      border: none;
      padding: 14px 40px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Oswald', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s;
      margin-top: 8px;
    }

    #startBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 24px var(--gold-glow);
    }

    .welcome-features {
      display: flex;
      gap: 24px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .feature-chip {
      background: var(--bg3);
      border: 1px solid var(--gold-dim);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      color: var(--text2);
    }

    /* ── Chat Area ── */
    #chatArea {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-dim) transparent;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

    /* ── Messages ── */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: msgIn 0.25s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user  { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }

    .msg-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      color: var(--text2);
    }

    .user .msg-label { text-align: right; }
    .assistant .msg-label { color: var(--gold); }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.65;
      font-size: 0.93rem;
    }

    .user .msg-bubble {
      background: var(--bg3);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-right-radius: 4px;
    }

    .assistant .msg-bubble {
      background: var(--bg2);
      border: 1px solid var(--gold-dim);
      border-bottom-left-radius: 4px;
    }

    /* ── Markdown content ── */
    .msg-bubble p { margin: 6px 0; }
    .msg-bubble p:first-child { margin-top: 0; }
    .msg-bubble p:last-child  { margin-bottom: 0; }

    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
      font-family: 'Oswald', sans-serif;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 14px 0 6px;
    }
    .msg-bubble h1 { font-size: 1.15rem; }
    .msg-bubble h2 { font-size: 1.05rem; }
    .msg-bubble h3 { font-size: 0.95rem; }
    .msg-bubble h1:first-child,
    .msg-bubble h2:first-child,
    .msg-bubble h3:first-child { margin-top: 0; }

    .msg-bubble strong { color: var(--gold); font-weight: 600; }
    .msg-bubble em { color: #a0a0c0; font-style: italic; }

    .msg-bubble ul, .msg-bubble ol { margin: 6px 0 6px 20px; }
    .msg-bubble li { margin: 3px 0; }

    .msg-bubble code {
      background: rgba(255,215,0,0.1);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.88em;
      font-family: monospace;
    }

    /* Leaderboard table */
    .msg-bubble table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
      font-size: 0.88rem;
      border-radius: 8px;
      overflow: hidden;
    }

    .msg-bubble thead tr {
      background: var(--gold);
      color: var(--bg);
    }

    .msg-bubble th {
      padding: 9px 13px;
      text-align: left;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.82rem;
    }

    .msg-bubble td {
      padding: 8px 13px;
      border-bottom: 1px solid var(--gold-dim);
    }

    .msg-bubble tbody tr:first-child td {
      color: var(--gold);
      font-weight: 600;
    }

    .msg-bubble tbody tr:last-child td { border-bottom: none; }

    .msg-bubble tbody tr:hover td {
      background: rgba(255,215,0,0.04);
    }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 2px 0;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* ── Input area ── */
    #inputArea {
      background: var(--bg2);
      border-top: 1px solid var(--gold-dim);
      padding: 14px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #userInput {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--gold-dim);
      color: var(--text);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 0.93rem;
      resize: none;
      max-height: 120px;
      min-height: 44px;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    #userInput:focus { border-color: var(--gold); }
    #userInput::placeholder { color: var(--text2); }
    #userInput:disabled { opacity: 0.5; }

    #sendBtn {
      background: var(--gold);
      color: var(--bg);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    #sendBtn:hover:not(:disabled) {
      transform: scale(1.08);
      box-shadow: 0 2px 14px var(--gold-glow);
    }

    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Responsive ── */
    @media (max-width: 580px) {
      .message { max-width: 95%; }
      #messages { padding: 14px; gap: 14px; }
      .header-left h1 { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-icon">🏆</span>
    <h1>KJ's Games Scorecard</h1>
  </div>
  <button id="newSessionBtn" onclick="newSession()">New Session</button>
</header>

<!-- Welcome -->
<div id="welcomeScreen">
  <div class="welcome-trophy">🏆</div>
  <h2>KJ's Games Scorecard</h2>
  <p>Your AI-powered MC and scorekeeper is ready to hype up game night. Pick a personality, add your players, and let the games begin.</p>
  <div class="welcome-features">
    <span class="feature-chip">🎮 Any game</span>
    <span class="feature-chip">📊 Auto scoring</span>
    <span class="feature-chip">🎤 Custom MC</span>
    <span class="feature-chip">🏅 Live leaderboard</span>
  </div>
  <button id="startBtn" onclick="startSession()">Start Session</button>
</div>

<!-- Chat -->
<div id="chatArea">
  <div id="messages"></div>
  <div id="inputArea">
    <textarea id="userInput" placeholder="Type your response…" rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()" title="Send">&#9658;</button>
  </div>
</div>

<script>
  marked.use({ gfm: true, breaks: true });

  let messages = [];
  let busy = false;

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function setBusy(state) {
    busy = state;
    document.getElementById('sendBtn').disabled = state;
    document.getElementById('userInput').disabled = state;
  }

  function scrollBottom() {
    const el = document.getElementById('messages');
    el.scrollTop = el.scrollHeight;
  }

  function addBubble(role, html = '') {
    const msgs = document.getElementById('messages');

    const wrap = document.createElement('div');
    wrap.className = `message ${role}`;

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You' : 'MC';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (html) {
      bubble.innerHTML = html;
    } else if (role === 'assistant') {
      bubble.innerHTML = '<div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
    }

    wrap.appendChild(label);
    wrap.appendChild(bubble);
    msgs.appendChild(wrap);
    scrollBottom();
    return bubble;
  }

  async function callAPI() {
    setBusy(true);
    const bubble = addBubble('assistant');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
      });

      if (!res.ok) throw new Error(`Server error ${res.status}`);

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      let full = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') continue;
          try {
            const obj = JSON.parse(raw);
            if (obj.error) throw new Error(obj.error);
            if (obj.text) {
              full += obj.text;
              bubble.innerHTML = marked.parse(full);
              scrollBottom();
            }
          } catch (_) {}
        }
      }

      messages.push({ role: 'assistant', content: full });
    } catch (err) {
      bubble.textContent = '⚠️ ' + err.message;
    }

    setBusy(false);
    document.getElementById('userInput').focus();
  }

  async function startSession() {
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('chatArea').style.display = 'flex';
    messages = [{ role: 'user', content: 'Start the session.' }];
    await callAPI();
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text || busy) return;

    input.value = '';
    input.style.height = 'auto';

    addBubble('user', marked.parse(text));
    messages.push({ role: 'user', content: text });

    await callAPI();
  }

  function newSession() {
    if (busy) return;
    messages = [];
    document.getElementById('messages').innerHTML = '';
    document.getElementById('chatArea').style.display = 'none';
    document.getElementById('welcomeScreen').style.display = 'flex';
  }
</script>
</body>
</html>
